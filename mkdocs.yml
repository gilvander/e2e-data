site_name: e2e-Data Docs
site_dir: public/docs
theme:
  name: material
  features:
    - navigation.tabs
    - navigation.top
    - navigation.indexes
    - toc.integrate
    - content.code.copy
  palette:
    # Palette toggle for light mode
    - scheme: default
      primary: grey
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    # Palette toggle for dark mode
    - scheme: slate
      primary: grey
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  favicon: assets/favicon.png
  icon:
    repo: fontawesome/brands/github
extra:
  social:
    - icon: fontawesome/brands/twitter
      link: https://twitter.com
    - icon: fontawesome/brands/youtube
      link: https://youtube.com
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com
extra_css:
  - theme-overrides.css
extra_javascript:
  - theme-sync.js
markdown_extensions:
  - attr_list
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - admonition
  - pymdownx.details
  - pymdownx.superfences

plugins: []
nav:
  - English:
    - Home: en/index.md
    - Getting Started: en/getting-started.md
    - Workspace Interface: en/workspace.md
    - Connections & Secrets: en/connections.md
    - Pipeline Designer: en/pipelines.md
    - Transformations: en/transformations.md
    - Data Catalog: en/data-catalog.md
    - Data Viz & Analytics: en/analytics.md
    - Scheduling: en/scheduling.md
    - Versioning: en/versioning.md
    - Script Editor: en/editor.md
    - Monitoring & Logs: en/monitoring.md
    - Architecture: en/architecture.md
    - Installation: en/installation.md
    - AI Agent: en/ai-agent.md
    - Final: en/final.md
  - Português:
    - Início: pt/index.md
    - Guia do Utilizador: pt/getting-started.md
    - Pipelines: pt/pipelines.md
    - Transformações: pt/transformations.md
    - Data Catalog: pt/data-catalog.md
    - Data Viz & Analytics: pt/analytics.md
    - Agendamento: pt/scheduling.md
    - Versionamento: pt/versioning.md
    - Editor de Código: pt/editor.md
    - Monitorização & Logs: pt/monitoring.md
    - Arquitetura: pt/architecture.md
    - Instalação: pt/installation.md
    - AI Agent: pt/ai-agent.md
    - Secção Final: pt/final.md
